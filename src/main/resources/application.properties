spring.application.name=todo-app-hexagonal-arquitecture-demo

### ===================================================================

### CONFIGURACIÓN DEL SERVIDOR (Tomcat 11 / Jakarta EE 11)

### ===================================================================

server.port=8080
server.compression.enabled=true
server.servlet.context-path=/api/v1 

### Seguridad: No enviar nunca trazas de código/stacktraces al cliente web

server.error.include-stacktrace=never 

### Estrategia de cabeceras de proxy nativa (detrás de Nginx, AWS ALB, etc.)

server.forward-headers-strategy=native 

### ===================================================================

### RENDIMIENTO MÁXIMO (Java 25 - Hilos Virtuales & Daemon Mode)

### ===================================================================

spring.threads.virtual.enabled=true 

### Mantiene la JVM activa ante hilos virtuales secundarios asíncronos daemon

spring.main.keep-alive=true 


### ===================================================================

### CONFIGURACIÓN ÚNICA: BASE DE DATOS H2 (EN MEMORIA)

### ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password= 

### Habilitar la consola web de H2 para desarrollo

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false 

### Configuración del Pool de Hikari básico para H2 con Hilos Virtuales

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=15000 

### ===================================================================

### CONFIGURACIÓN GLOBAL DE HIBERNATE / JPA (H2)

### ===================================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update 

### Se desactiva el volcado clásico por consola tradicional para usar los loggers previos

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false 

### Optimización crítica para Hilos Virtuales (Evita el anclaje y saturación del Pool)

spring.jpa.open-in-view=false 

### ===================================================================

### CONFIGURACIÓN DOCUMENTACIÓN (Swagger & Scalar)

### ===================================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
scalar.enabled=true 

### ===================================================================

### GESTIÓN DE ARCHIVOS (Multipart)

### ===================================================================

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB 

### ===================================================================

### RECURSOS ESTÁTICOS

### ===================================================================

spring.web.resources.static-locations=classpath:/static/,file:uploads/
